name: Deploy GraphEm Web

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build GraphEm wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: graphem/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: graphem/web
        run: npm ci
      - name: Prepare Python wheel
        run: |
          mkdir -p graphem/web/public/dist
          cp dist/*.whl graphem/web/public/dist
      - name: Build frontend
        working-directory: graphem/web
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: graphem/web/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4